<form [formGroup]="form" (ngSubmit)="save()">
  @if(this.isBrowser){
    <quill-editor [modules]="customQuillModules" [theme]="'snow'" formControlName="body"
      [styles]="{ minHeight: '100px', background: '#0a0a0a', color: '#ffff'}" />
    <button type="submit" mat-flat-button [disabled]="form.invalid">Publicar</button>
  }
</form>
