<h2 mat-dialog-title>Editor de Preview</h2>
<mat-dialog-content>
    <div class="row">
        <div class="col-12">
            <mat-form-field appearance="fill" class="w-100">
                <mat-label>Clique ou arraste seu mp3 aqui !!!</mat-label>
                <ngx-mat-dropzone>
                  <input [formControl]="ctrlFile" [multiple]="false" type="file" fileInput accept=".mp3,audio/mp3"/>
                </ngx-mat-dropzone>
            </mat-form-field>



            <div  #waveform class="w-100 container-preview"></div>

            @if(loadedLocale() && wavesurfer){
                <button  (click)="wavesurfer.playPause()" mat-mini-fab aria-label="player button" class="playPause" style="background: #383351">
                    <mat-icon>
                        @if(wavesurfer.isPlaying()){
                            stop_circle
                        }@else{
                            play_circle
                        }
                    </mat-icon>
                  </button>
            }

            <ul class="my-3">
                <li>Regras:</li>
                <ul>
                    <li>Arquivo no formato MP3</li>
                    <li>Tamanho máximo de 50mb</li>
                    <li>Duração de 30 segundos</li>
                    <li>Não feche a tela até finalizar</li>
                </ul>
            </ul>

        </div>
    </div>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button mat-dialog-close>CANCELAR</button>
  <button (click)="save()" [disabled]="!loadedLocale()" mat-button class="btn-save" [ngClass]="{'btn-save-disabled': !loadedLocale()}" >SALVAR</button>
</mat-dialog-actions>
