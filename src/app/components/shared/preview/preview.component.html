<div class="preview">
    <div id="waveform" class="w-100 wave" [ngClass]="{'preview-none': !musicPreview()}"></div>
</div>

@if(loadedLocale() && wavesurfer){
    <button  (click)="wavesurfer.playPause()" mat-mini-fab aria-label="player button" class="playPause" style="background: #383351">
        <mat-icon>
            @if(wavesurfer.isPlaying()){
                stop_circle
            }@else{
                play_circle
            }
        </mat-icon>
      </button>
  }
