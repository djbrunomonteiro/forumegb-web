<div class="box-body">
  <div class="row">
    <div class="col-md-3">
      <div class="user">
        <div class="avatar">
          @if(post.user?.photoURL; as photo){
            <img [src]="photo" alt="photo url">

          }@else{
            <mat-icon>
              account_circle
            </mat-icon>
          }
        </div>
        <span>{{post.user?.displayName | titlecase}}</span>
      </div>
    </div>
    <div class="col-md-9">
      <div class="description" [innerHTML]="post.body"></div>
      <div class="w-100 d-flex justify-content-center">
        <span class="date">postado em {{post.created_at | syncDate}}</span>
      </div>
    </div>
  </div>

</div>
